<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>nanbi studio</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <link rel="icon" type="image/svg+xml" href="icons/nanbi-monogram.svg">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Restored Supabase Dependency -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="m-0 p-0 h-full overflow-hidden bg-slate-50 text-slate-900">
    <div id="nanbi-root"></div>
    
    <div id="error-log" style="color: red; padding: 20px; font-family: monospace; white-space: pre-wrap; z-index: 9999; position: absolute; top:0; left:0; pointer-events: none;"></div>
    
    <script type="module" src="core/router.js"></script>
    <script>
        window.addEventListener('error', function(e) {
            document.getElementById('error-log').innerText += '\nFATAL BOOT ERROR: ' + e.message;
        });
    </script>
</body>
</html>
