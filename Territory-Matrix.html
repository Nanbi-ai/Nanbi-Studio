<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Matrix Module</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        .table-container { overflow-y: auto; }
        th { position: sticky; top: 0; background-color: #f8fafc; color: #475569; z-index: 10; text-align: center; border-bottom: 2px solid #e2e8f0; }
        td { text-align: center; border-bottom: 1px solid #f1f5f9; }
        .col-left { text-align: left; }
        .row-active { background-color: #f0fdfa !important; border-left: 4px solid #0d9488; }
        #map { height: 100%; width: 100%; border-radius: 0.25rem; z-index: 1; }
        /* Hide scrollbars for cleaner embedded look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-full flex flex-col overflow-hidden p-2">

    <!-- Compact Top Row -->
    <div class="flex justify-between items-center px-1 pb-2 shrink-0">
        <h2 class="text-lg font-bold text-slate-700 tracking-tight flex items-center gap-2">
            <span class="text-teal-600">❖</span> Territories
        </h2>
        <div id="syncStatus" class="text-[10px] font-mono text-slate-500 bg-white px-2 py-1 rounded border border-slate-200 flex items-center gap-1 shadow-sm">
            Booting Infrastructure...
        </div>
    </div>

    <!-- Main Workspace (Space Optimized) -->
    <main class="flex-1 flex gap-3 overflow-hidden">
        
        <!-- Left Panel: Hierarchy & Map -->
        <aside class="w-[35%] flex flex-col gap-3 overflow-hidden shrink-0">
            <div class="bg-white p-3 rounded border border-slate-200 flex flex-col gap-2 shrink-0 shadow-sm">
                <div class="grid grid-cols-2 gap-2 text-[10px]">
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">Country</label><select id="selCountry" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none"></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">State</label><select id="selState" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">District</label><select id="selDistrict" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">Taluk</label><select id="selTaluk" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled></select></div>
                    <div class="flex flex-col col-span-2"><label class="font-bold text-slate-400 uppercase mb-0.5">Local Body</label><select id="selLocalBody" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled></select></div>
                </div>
            </div>

            <div class="flex-1 bg-white p-1.5 rounded border border-slate-200 flex flex-col relative overflow-hidden shadow-sm">
                <div class="flex-1 relative rounded overflow-hidden border border-slate-200">
                    <div id="map"></div>
                </div>
            </div>
        </aside>

        <!-- Right Panel: Ledger & Inspector -->
        <section class="w-[65%] flex flex-col gap-3 overflow-hidden">
            
            <div class="bg-white p-2.5 rounded border border-slate-200 flex justify-around items-center shrink-0 shadow-sm">
                <div class="text-center">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Active Territories</p>
                    <p class="text-2xl font-black text-slate-700" id="metricCount">0</p>
                </div>
                <div class="text-center border-l border-slate-200 pl-8">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Market Capacity</p>
                    <p class="text-2xl font-black text-emerald-600" id="metricMPS">₹0</p>
                </div>
            </div>

            <div class="flex-1 bg-white rounded border border-slate-200 flex flex-col overflow-hidden shadow-sm">
                <div class="table-container flex-1">
                    <table class="w-full border-collapse text-[10px]">
                        <thead>
                            <tr>
                                <th class="p-2 uppercase tracking-wider font-bold">ID</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Ward Name</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Biz-Class</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Civic Coverage</th>
                            </tr>
                        </thead>
                        <tbody id="territoryTbody" class="cursor-pointer text-slate-600"></tbody>
                    </table>
                </div>
            </div>

            <div class="h-[22vh] bg-white rounded border border-slate-200 p-3 flex flex-col overflow-hidden shrink-0 shadow-sm">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1.5 mb-2">
                    <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500" id="deepDiveTitle">Entity Inspector</h3>
                    <span class="text-[9px] text-slate-400 font-mono" id="deepDiveSubtitle">Select a territory</span>
                </div>
                <div id="deepDiveContent" class="flex-1 overflow-y-auto text-[10px] text-slate-400 flex items-center justify-center">
                    Awaiting node selection...
                </div>
            </div>
        </section>
    </main>

    <!-- ES MODULE SCRIPT -->
    <script type="module">
        function printError(msg) {
            const status = document.getElementById('syncStatus');
            if(status) status.innerHTML = `<span class="text-red-500 font-bold">CRASH: ${msg}</span>`;
        }

        window.addEventListener('error', (event) => printError(event.message));
        window.addEventListener('unhandledrejection', (event) => printError(event.reason?.message || "Unknown Promise Rejection"));

        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        let map, markers = [];
        let globalData = [];
        let filteredData = [];

        const wardGeoAnchor = {
            1: [12.9180, 77.5560], 4: [12.9240, 77.5780], 14: [12.9260, 77.5930], 65: [12.9420, 77.5750]
        };

        async function boot() {
            try {
                const SUPABASE_URL = "https://yeoracoxyjzgpsyxgwri.supabase.co";
                
                // --- PASTE YOUR ACTUAL SUPABASE ANON KEY HERE ---
                const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inllb3JhY294eWp6Z3BzeXhnd3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzgzNzUsImV4cCI6MjEwMzMxNDM3NX0.rNcvhRCw4KyfNpsWH6IYxlQT07zJ7i68Zg5jnpqj9yc";
                // ------------------------------------------------
                
                const nanbiDB = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                
                initMap();
                await fetchRelationalData(nanbiDB);
            } catch(err) {
                printError(err.message);
            }
        }

        function initMap() {
            map = L.map('map', { zoomControl: false, attributionControl: false }).setView([12.9250, 77.5800], 12);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);
        }

        async function fetchRelationalData(db) {
            const { data, error } = await db
                .from('territories')
                .select(`*, local_bodies ( body_name, taluks ( taluk_name, districts ( district_name, states ( state_name, countries (country_name) ) ) ) ), territory_entity_mappings ( relationship_type, civic_entities (entity_name, category_id) )`);

            if (error) throw new Error(error.message);
            const safeData = data || [];

            if(safeData.length === 0) {
                document.getElementById('syncStatus').innerHTML = `<span class="text-amber-500 font-bold">Connected (0)</span>`;
                return;
            }

            document.getElementById('syncStatus').innerHTML = `<span class="text-emerald-500 font-bold">● Synchronized</span>`;

            globalData = safeData.map(t => ({
                ...t,
                country: t.local_bodies?.taluks?.districts?.states?.countries?.country_name || 'India',
                state: t.local_bodies?.taluks?.districts?.states?.state_name || 'Karnataka',
                district: t.local_bodies?.taluks?.districts?.district_name || 'Bengaluru Urban',
                taluk: t.local_bodies?.taluks?.taluk_name || 'Bengaluru South Taluk',
                localBody: t.local_bodies?.body_name || 'BBMP South',
                civicEntities: t.territory_entity_mappings || []
            }));

            filteredData = [...globalData];
            initCascadingDropdowns();
            updateUI();
        }

        function initCascadingDropdowns() {
            const getUnique = (key, dataset) => [...new Set(dataset.map(item => item[key]))].filter(Boolean);
            const populate = (id, items) => {
                const select = document.getElementById(id);
                select.innerHTML = '<option value="All">All</option>';
                items.forEach(item => select.innerHTML += `<option value="${item}">${item}</option>`);
                select.disabled = items.length === 0;
            };

            const filterMatrix = () => {
                const c = document.getElementById('selCountry').value;
                const s = document.getElementById('selState').value;
                const d = document.getElementById('selDistrict').value;
                const t = document.getElementById('selTaluk').value;
                const lb = document.getElementById('selLocalBody').value;

                filteredData = globalData.filter(item => 
                    (c === 'All' || item.country === c) && (s === 'All' || item.state === s) &&
                    (d === 'All' || item.district === d) && (t === 'All' || item.taluk === t) &&
                    (lb === 'All' || item.localBody === lb)
                );
                updateUI();
            };

            populate('selCountry', getUnique('country', globalData));
            ['selCountry', 'selState', 'selDistrict', 'selTaluk', 'selLocalBody'].forEach(id => {
                document.getElementById(id).addEventListener('change', filterMatrix);
            });
        }

        function updateUI() {
            document.getElementById('metricCount').innerText = filteredData.length;
            document.getElementById('metricMPS').innerText = "₹" + (filteredData.length * 35000).toLocaleString('en-IN');
            renderTable(filteredData);
            renderHeatMap(filteredData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('territoryTbody');
            tbody.innerHTML = '';
            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.onclick = () => isolateTerritory(item, tr);

                const civicCount = item.civicEntities.length;
                const civicBadge = civicCount > 0 
                    ? `<span class="bg-emerald-100 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded font-bold text-[8px]">${civicCount} Nodes</span>`
                    : `<span class="bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded text-[8px]">0 Nodes</span>`;

                tr.innerHTML = `
                    <td class="p-2 text-teal-700 font-bold border-r border-slate-100">${item.territory_id}</td>
                    <td class="p-2 text-slate-700 font-bold col-left border-r border-slate-100 whitespace-nowrap"><span class="text-slate-400 mr-1">W-${item.territory_no}:</span> ${item.territory_name}</td>
                    <td class="p-2 text-sky-600 font-bold col-left border-r border-slate-100 whitespace-nowrap">${item.biz_class}</td>
                    <td class="p-2 col-left">${civicBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderHeatMap(data) {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            let latlngs = [];

            data.forEach(item => {
                const wNo = parseInt(item.territory_no);
                const lat = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][0] : 12.9250 + (Math.sin(wNo) * 0.04);
                const lng = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][1] : 77.5800 + (Math.cos(wNo) * 0.04);
                latlngs.push([lat, lng]);

                const circle = L.circleMarker([lat, lng], { radius: 6, fillColor: '#0284c7', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 0.8 }).addTo(map);
                circle.on('click', () => isolateTerritory(item));
                markers.push(circle);
            });
            if(latlngs.length > 0) map.flyToBounds(L.latLngBounds(latlngs), { padding: [20, 20], maxZoom: 14 });
        }

        function isolateTerritory(item, trElement = null) {
            document.querySelectorAll('#territoryTbody tr').forEach(r => r.classList.remove('row-active'));
            if (trElement) trElement.classList.add('row-active');

            const wNo = parseInt(item.territory_no);
            const lat = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][0] : 12.9250 + (Math.sin(wNo) * 0.04);
            const lng = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][1] : 77.5800 + (Math.cos(wNo) * 0.04);
            map.flyTo([lat, lng], 15, { duration: 1 });

            document.getElementById('deepDiveTitle').innerText = `${item.territory_id} — ${item.territory_name}`;
            document.getElementById('deepDiveSubtitle').innerText = `H3: ${item.h3_polygon_anchor}`;

            const content = document.getElementById('deepDiveContent');
            if (item.civicEntities.length === 0) {
                content.innerHTML = `<div class="text-slate-400 italic w-full text-center text-[10px]">No mapped infrastructure.</div>`;
                return;
            }

            let html = `<div class="w-full flex flex-col gap-1.5">`;
            item.civicEntities.forEach(ent => {
                html += `
                    <div class="bg-slate-50 border border-slate-200 p-1.5 rounded flex justify-between items-center shadow-sm">
                        <div class="flex items-center gap-2">
                            <span class="text-base">🏛️</span>
                            <div class="flex flex-col">
                                <span class="font-bold text-[10px]">${ent.civic_entities?.entity_name || 'Unknown'}</span>
                                <span class="text-[8px] uppercase font-bold opacity-70">${ent.relationship_type.replace(/_/g, ' ')}</span>
                            </div>
                        </div>
                    </div>
                `;
            });
            content.innerHTML = html + `</div>`;
        }

        boot();
    </script>
</body>
</html>
