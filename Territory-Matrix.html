<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Territory Matrix Module</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .table-container { overflow-y: auto; max-height: 52vh; }
        th { position: sticky; top: 0; background-color: #f8fafc; color: #475569; z-index: 10; text-align: center; border-bottom: 2px solid #e2e8f0; }
        td { text-align: center; border-bottom: 1px solid #f1f5f9; }
        .col-left { text-align: left; }
        .row-active { background-color: #f0fdfa !important; border-left: 4px solid #0d9488; }
        
        #map-wrapper { position: relative; width: 100%; height: 100%; min-height: 380px; flex: 1; }
        #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; border-radius: 0.25rem; z-index: 1; }
        
        path.leaflet-interactive { transition: fill-opacity 0.2s, stroke-width 0.2s; outline: none; }
        path.leaflet-interactive:hover { fill-opacity: 0.8 !important; stroke-width: 2px !important; stroke: #0f172a !important; cursor: pointer; }
        
        .map-nav-btn { background: white; border: 1px solid #cbd5e1; padding: 3px 8px; border-radius: 4px; font-size: 10px; font-weight: 700; color: #334155; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
        .map-nav-btn:hover { background: #f8fafc; color: #0d9488; }
        
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background-color: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-full flex flex-col overflow-hidden p-2">
    <main class="flex-1 flex gap-3 overflow-hidden">
        <aside class="w-[38%] flex flex-col gap-3 overflow-hidden shrink-0">
            <div class="bg-white p-3 rounded border border-slate-200 flex flex-col gap-2 shrink-0 shadow-sm">
                <div class="flex justify-between items-center pb-1 border-b border-slate-100">
                    <span id="geoHierarchyBreadcrumb" class="text-[10px] font-bold text-teal-700 uppercase tracking-wider">World View</span>
                    <button onclick="resetToWorld()" class="map-nav-btn text-[9px]">Reset to Globe</button>
                </div>
                <div class="grid grid-cols-2 gap-2 text-[10px]">
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">Country</label><select id="selCountry" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled><option value="All">Loading...</option></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">State / Province</label><select id="selState" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled><option value="All">All</option></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">District</label><select id="selDistrict" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled><option value="All">All</option></select></div>
                    <div class="flex flex-col"><label class="font-bold text-slate-400 uppercase mb-0.5">Taluk / County</label><select id="selTaluk" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled><option value="All">All</option></select></div>
                    <div class="flex flex-col col-span-2"><label class="font-bold text-slate-400 uppercase mb-0.5">Ward / Territory</label><select id="selWard" class="bg-slate-50 border border-slate-200 rounded p-1 text-slate-700 outline-none" disabled><option value="All">All</option></select></div>
                </div>
            </div>
            
            <div class="flex-1 bg-white p-1.5 rounded border border-slate-200 flex flex-col relative overflow-hidden shadow-sm">
                <div id="map-wrapper" class="rounded overflow-hidden border border-slate-200">
                    <div id="map"></div>
                </div>
            </div>
        </aside>

        <section class="w-[62%] flex flex-col gap-3 overflow-hidden">
            <div class="bg-white p-2.5 rounded border border-slate-200 flex justify-around items-center shrink-0 shadow-sm">
                <div class="text-center">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Active Territories</p>
                    <p class="text-2xl font-black text-slate-700" id="metricCount">0</p>
                </div>
                <div class="text-center border-l border-slate-200 pl-8">
                    <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest">Market Capacity</p>
                    <p class="text-2xl font-black text-emerald-600" id="metricMPS">₹0</p>
                </div>
            </div>
            
            <div class="flex-1 bg-white rounded border border-slate-200 flex flex-col overflow-hidden shadow-sm">
                <div class="table-container flex-1">
                    <table class="w-full border-collapse text-[10px]">
                        <thead>
                            <tr>
                                <th class="p-2 uppercase tracking-wider font-bold">ID</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Ward Name</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Biz-Class</th>
                                <th class="p-2 uppercase tracking-wider font-bold text-left">Civic Coverage</th>
                            </tr>
                        </thead>
                        <tbody id="territoryTbody" class="cursor-pointer text-slate-600"></tbody>
                    </table>
                </div>
            </div>
            
            <div class="h-[22vh] bg-white rounded border border-slate-200 p-3 flex flex-col overflow-hidden shrink-0 shadow-sm">
                <div class="flex justify-between items-center border-b border-slate-100 pb-1.5 mb-2">
                    <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500" id="deepDiveTitle">Entity Inspector</h3>
                    <span class="text-[9px] text-slate-400 font-mono" id="deepDiveSubtitle">Select a territory</span>
                </div>
                <div id="deepDiveContent" class="flex-1 overflow-y-auto text-[10px] text-slate-400 flex items-center justify-center">
                    Awaiting node selection...
                </div>
            </div>
        </section>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

        function updateParentStatus(html) { try { const parentStatus = window.parent.document.getElementById('tm-status'); if(parentStatus) parentStatus.innerHTML = html; } catch(e) { } }

        const SUPABASE_URL = "https://yeoracoxyjzgpsyxgwri.supabase.co";
        // --- PASTE YOUR ACTUAL SUPABASE ANON KEY HERE ---
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inllb3JhY294eWp6Z3BzeXhnd3JpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzgzNzUsImV4cCI6MjEwMzMxNDM3NX0.rNcvhRCw4KyfNpsWH6IYxlQT07zJ7i68Zg5jnpqj9yc";
        window.nanbiDB = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let map, currentGeoLayer = null, markers = [];
        let globalData = [], filteredData = [];
        let activeLevel = 'world'; 

        const wardGeoAnchor = { 1: [12.9180, 77.5560], 4: [12.9240, 77.5780], 14: [12.9260, 77.5930], 65: [12.9420, 77.5750] };

        function getDistinctColor(name) {
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            return `hsl(${Math.abs(hash % 360)}, 65%, 55%)`; 
        }

        async function boot() {
            try {
                initMap();
                initDropdownListeners();
                await fetchRelationalData(); 
                
                const { data } = await window.nanbiDB.rpc('get_countries_geojson');
                if (data) {
                    const sel = document.getElementById('selCountry');
                    sel.innerHTML = '<option value="All">All</option>';
                    data.map(d => d.name).sort().forEach(c => sel.innerHTML += `<option value="${c}">${c}</option>`);
                    sel.disabled = false;
                }

                await renderSpatialLayer('world');
            } catch(err) {
                updateParentStatus(`<span style="color:#ef4444; font-weight:bold;">CRASH: ${err.message}</span>`);
            }
        }

        function initMap() {
            // FRACTIONAL ZOOM FIX: zoomSnap 0.1 allows the map to perfectly fit boundaries edge-to-edge
            map = L.map('map', { 
                zoomControl: true, 
                attributionControl: false,
                zoomSnap: 0.1, 
                zoomDelta: 0.5 
            }).setView([22.5937, 78.9629], 3);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19 }).addTo(map);

            let invalidateCount = 0;
            let invalidator = setInterval(() => { map.invalidateSize(true); invalidateCount++; if (invalidateCount > 8) clearInterval(invalidator); }, 250);
            window.addEventListener('resize', () => { map.invalidateSize(true); });
        }

        async function renderSpatialLayer(level, parentName = '') {
            activeLevel = level;
            if (currentGeoLayer) { map.removeLayer(currentGeoLayer); currentGeoLayer = null; }
            markers.forEach(m => map.removeLayer(m));
            markers = [];

            updateParentStatus(`<span style="color:#f59e0b; font-weight:bold;">Loading ${level.toUpperCase()}...</span>`);
            document.getElementById('geoHierarchyBreadcrumb').innerText = parentName ? `${parentName} (${level.toUpperCase()})` : 'World View';

            let rpcName = '';
            let rpcParams = {};
            let targetDropdownId = null;

            if (level === 'world') { rpcName = 'get_countries_geojson'; targetDropdownId = 'selCountry'; }
            else if (level === 'country') { rpcName = 'get_states_for_country'; rpcParams = { p_country: parentName }; targetDropdownId = 'selState'; }
            else if (level === 'state') { rpcName = 'get_districts_for_state'; rpcParams = { p_state: parentName }; targetDropdownId = 'selDistrict'; }
            else if (level === 'district') { rpcName = 'get_taluks_for_district'; rpcParams = { p_district: parentName }; targetDropdownId = 'selTaluk'; }

            if (level === 'taluk') {
                renderWardFallbacks();
                populateWardDropdown(parentName);
                updateParentStatus(`<span style="color:#34d399; font-weight:bold;">● Layer Ready (Ward)</span>`);
                return;
            }

            const { data, error } = await window.nanbiDB.rpc(rpcName, rpcParams);
            if (error || !data || data.length === 0) { updateParentStatus(`<span style="color:#ef4444; font-weight:bold;">No Spatial Data Found</span>`); return; }

            let layerNames = [];
            let featureGroup = L.featureGroup();

            data.forEach(item => {
                if (!item.geojson) return;
                try {
                    const parsedGeom = JSON.parse(item.geojson);
                    const displayName = item.name || item.id;
                    layerNames.push(displayName);
                    
                    const polyColor = getDistinctColor(displayName);
                    const styleOpts = { color: '#ffffff', weight: 1.5, fillColor: polyColor, fillOpacity: 0.45 };
                    const layer = L.geoJSON(parsedGeom, { style: styleOpts });

                    layer.bindTooltip(`<b>${displayName}</b>`, {
                        direction: 'top',
                        className: 'text-[11px] font-sans font-bold text-slate-800 bg-white/95 px-2 py-1 rounded shadow-md border border-slate-200',
                        sticky: true
                    });

                    layer.on('click', () => { handleMapPolygonClick(level, displayName); });
                    featureGroup.addLayer(layer);
                } catch(e) {}
            });

            currentGeoLayer = featureGroup.addTo(map);

            if (targetDropdownId && layerNames.length > 0) {
                const sel = document.getElementById(targetDropdownId);
                const currentVal = sel.value;
                sel.innerHTML = '<option value="All">All</option>';
                layerNames.sort().forEach(n => sel.innerHTML += `<option value="${n}">${n}</option>`);
                sel.value = layerNames.includes(currentVal) ? currentVal : 'All';
                sel.disabled = false;
            }

            map.invalidateSize(true);
            if (featureGroup.getLayers().length > 0) {
                setTimeout(() => { 
                    map.invalidateSize(true);
                    map.flyToBounds(featureGroup.getBounds(), { padding: [0, 0], maxZoom: level === 'world' ? 3 : 11, duration: 1.2 }); 
                }, 200);
            }
            updateParentStatus(`<span style="color:#34d399; font-weight:bold;">● ${level.toUpperCase()} Active</span>`);
        }

        function handleMapPolygonClick(level, entityName) {
            const dropdownId = level === 'world' ? 'selCountry' :
                               level === 'country' ? 'selState' :
                               level === 'state' ? 'selDistrict' : 'selTaluk';
            const sel = document.getElementById(dropdownId);
            sel.value = entityName;
            sel.dispatchEvent(new Event('change'));
        }

        function renderWardFallbacks() {
            markers.forEach(m => map.removeLayer(m));
            markers = [];
            let latlngs = [];

            filteredData.forEach(item => {
                const wNo = parseInt(item.territory_no) || 0;
                const row = Math.floor(wNo / 10);
                const col = wNo % 10;
                const lat = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][0] : 12.8900 + (row * 0.006);
                const lng = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][1] : 77.5600 + (col * 0.006);
                latlngs.push([lat, lng]);

                const circle = L.circleMarker([lat, lng], { radius: 6, fillColor: '#0284c7', color: '#ffffff', weight: 1.5, opacity: 1, fillOpacity: 0.85 }).addTo(map);
                circle.bindTooltip(`<b>W-${item.territory_no}</b>: ${item.territory_name}`, { direction: 'top', className: 'text-[10px] font-bold shadow-md bg-white', sticky: true });
                circle.on('click', () => { isolateTerritory(item); });
                markers.push(circle);
            });

            if (latlngs.length > 0) { map.flyToBounds(L.latLngBounds(latlngs), { padding: [35, 35], maxZoom: 14 }); }
        }

        async function fetchRelationalData() {
            const { data, error } = await window.nanbiDB
                .from('territories')
                .select(`*, local_bodies ( body_name, taluks ( taluk_name, districts ( district_name, states ( state_name, countries (country_name) ) ) ) ), territory_entity_mappings ( relationship_type, civic_entities (entity_name, category_id) )`);

            if (error) return;
            const safeData = data || [];

            globalData = safeData.map(t => ({
                ...t,
                country: t.local_bodies?.taluks?.districts?.states?.countries?.country_name || 'India',
                state: t.local_bodies?.taluks?.districts?.states?.state_name || 'Karnataka',
                district: t.local_bodies?.taluks?.districts?.district_name || 'Bengaluru Urban',
                taluk: t.local_bodies?.taluks?.taluk_name || 'Bengaluru South Taluk',
                territory_name: `W-${t.territory_no}: ${t.territory_name}`,
                civicEntities: t.territory_entity_mappings || []
            }));

            filteredData = [...globalData];
            updateUI();
        }

        function populateWardDropdown(talukName) {
            const selWard = document.getElementById('selWard');
            selWard.innerHTML = '<option value="All">All</option>';
            const wards = globalData.filter(i => i.taluk === talukName).map(i => i.territory_name).sort();
            wards.forEach(w => selWard.innerHTML += `<option value="${w}">${w}</option>`);
            selWard.disabled = wards.length === 0;
        }

        function initDropdownListeners() {
            const cascadeClear = (ids) => {
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    el.innerHTML = '<option value="All">All</option>';
                    el.disabled = true;
                });
            };

            document.getElementById('selCountry').addEventListener('change', (e) => {
                const val = e.target.value;
                cascadeClear(['selState', 'selDistrict', 'selTaluk', 'selWard']);
                filterMatrix();
                if (val === 'All') renderSpatialLayer('world');
                else renderSpatialLayer('country', val);
            });

            document.getElementById('selState').addEventListener('change', (e) => {
                const val = e.target.value;
                cascadeClear(['selDistrict', 'selTaluk', 'selWard']);
                filterMatrix();
                if (val === 'All') renderSpatialLayer('country', document.getElementById('selCountry').value);
                else renderSpatialLayer('state', val);
            });

            document.getElementById('selDistrict').addEventListener('change', (e) => {
                const val = e.target.value;
                cascadeClear(['selTaluk', 'selWard']);
                filterMatrix();
                if (val === 'All') renderSpatialLayer('state', document.getElementById('selState').value);
                else renderSpatialLayer('district', val);
            });

            document.getElementById('selTaluk').addEventListener('change', (e) => {
                const val = e.target.value;
                cascadeClear(['selWard']);
                filterMatrix();
                if (val === 'All') renderSpatialLayer('district', document.getElementById('selDistrict').value);
                else renderSpatialLayer('taluk', val);
            });

            document.getElementById('selWard').addEventListener('change', (e) => {
                filterMatrix();
                if (e.target.value !== 'All' && filteredData.length === 1) {
                    isolateTerritory(filteredData[0]);
                } else if (e.target.value === 'All') {
                    renderSpatialLayer('taluk', document.getElementById('selTaluk').value);
                }
            });
        }

        function filterMatrix() {
            const c = document.getElementById('selCountry').value;
            const s = document.getElementById('selState').value;
            const d = document.getElementById('selDistrict').value;
            const t = document.getElementById('selTaluk').value;
            const w = document.getElementById('selWard').value;

            filteredData = globalData.filter(item => 
                (c === 'All' || item.country === c) && (s === 'All' || item.state === s) &&
                (d === 'All' || item.district === d) && (t === 'All' || item.taluk === t) &&
                (w === 'All' || item.territory_name === w)
            );
            updateUI();
        }

        window.resetToWorld = function() {
            document.getElementById('selCountry').value = 'All';
            document.getElementById('selCountry').dispatchEvent(new Event('change'));
        };

        function updateUI() {
            document.getElementById('metricCount').innerText = filteredData.length;
            document.getElementById('metricMPS').innerText = "₹" + (filteredData.length * 35000).toLocaleString('en-IN');
            renderTable(filteredData);
        }

        function renderTable(data) {
            const tbody = document.getElementById('territoryTbody');
            tbody.innerHTML = '';
            
            if (data.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="p-8 text-center bg-slate-50/50"><div class="text-3xl mb-3">🚀</div><div class="font-bold text-[12px] uppercase tracking-widest text-slate-500 mb-1">Yet to be Launched</div><div class="text-[10px] text-slate-400">Territory operations for this specific region are currently in the pipeline.</div></td></tr>`;
                return;
            }

            data.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-slate-50 transition";
                tr.onclick = () => { isolateTerritory(item, tr); };

                const civicCount = item.civicEntities.length;
                const civicBadge = civicCount > 0 
                    ? `<span class="bg-emerald-100 text-emerald-700 border border-emerald-200 px-1.5 py-0.5 rounded font-bold text-[8px]">${civicCount} Nodes</span>`
                    : `<span class="bg-slate-100 text-slate-400 px-1.5 py-0.5 rounded text-[8px]">0 Nodes</span>`;

                tr.innerHTML = `
                    <td class="p-2 text-teal-700 font-bold border-r border-slate-100">${item.territory_id}</td>
                    <td class="p-2 text-slate-700 font-bold col-left border-r border-slate-100 whitespace-nowrap">${item.territory_name}</td>
                    <td class="p-2 text-sky-600 font-bold col-left border-r border-slate-100 whitespace-nowrap">${item.biz_class}</td>
                    <td class="p-2 col-left">${civicBadge}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function isolateTerritory(item, trElement = null) {
            const selWard = document.getElementById('selWard');
            if (selWard && selWard.value !== item.territory_name) { selWard.value = item.territory_name; }

            document.querySelectorAll('#territoryTbody tr').forEach(r => r.classList.remove('row-active'));
            if (trElement) { trElement.classList.add('row-active'); }
            else {
                const rows = document.querySelectorAll('#territoryTbody tr');
                for (let r of rows) {
                    if (r.innerText.includes(item.territory_id)) { r.classList.add('row-active'); r.scrollIntoView({block: "center", behavior: "smooth"}); break; }
                }
            }

            const wNo = parseInt(item.territory_no) || 0;
            const row = Math.floor(wNo / 10);
            const col = wNo % 10;
            const lat = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][0] : 12.8900 + (row * 0.006);
            const lng = wardGeoAnchor[wNo] ? wardGeoAnchor[wNo][1] : 77.5600 + (col * 0.006);
            
            map.invalidateSize(true);
            setTimeout(() => { map.flyTo([lat, lng], 15, { duration: 1.5 }); }, 100);

            document.getElementById('deepDiveTitle').innerText = `${item.territory_id} — ${item.territory_name}`;
            document.getElementById('deepDiveSubtitle').innerText = `H3: ${item.h3_polygon_anchor}`;

            const content = document.getElementById('deepDiveContent');
            if (item.civicEntities.length === 0) {
                content.innerHTML = `<div class="text-slate-400 italic w-full text-center text-[10px] py-4">No mapped infrastructure found for this sector.</div>`;
                return;
            }

            let html = `<div class="w-full flex flex-col gap-1.5">`;
            item.civicEntities.forEach(ent => {
                html += `<div class="bg-slate-50 border border-slate-200 p-1.5 rounded flex justify-between items-center shadow-sm"><div class="flex items-center gap-2"><span class="text-base">🏛️</span><div class="flex flex-col"><span class="font-bold text-[10px]">${ent.civic_entities?.entity_name || 'Unknown'}</span><span class="text-[8px] uppercase font-bold opacity-70">${ent.relationship_type.replace(/_/g, ' ')}</span></div></div></div>`;
            });
            content.innerHTML = html + `</div>`;
        }

        boot();
    </script>
</body>
</html>
